<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Sandi - Yamzz Market</title><link rel="stylesheet" href="/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:28px;border:1px solid rgba(49,211,255,.2);border-radius:24px;background:rgba(7,18,39,.9);box-shadow:0 20px 70px rgba(0,0,0,.5)}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field label{font-size:11px;font-weight:700;color:#91aac7}.field input{width:100%;border:1px solid rgba(75,203,255,.18);background:#071329;color:#eaf7ff;border-radius:11px;padding:12px;outline:none;font:500 13px Inter}.msg{padding:11px;border-radius:10px;font-size:12px;margin-bottom:12px}.ok{background:rgba(35,220,155,.1);color:#65efb6}.err{background:rgba(255,55,80,.1);color:#ff91a0}</style></head><body><div class="card"><div style="text-align:center"><span class="material-symbols-rounded" style="font-size:52px;color:#39dcff;text-shadow:0 0 22px #00bfff">lock_reset</span><h1>Buat Sandi Baru</h1><p style="color:#8ba2bf">Masukkan sandi baru untuk akun Anda.</p></div><div id="msg"></div><div class="field"><label>Password Baru</label><input id="p" type="password" minlength="6" placeholder="Minimal 6 karakter"></div><div class="field"><label>Ulangi Password</label><input id="p2" type="password" minlength="6"></div><button class="btn primary full" id="save">Simpan Sandi</button><p style="text-align:center;margin-top:16px"><a href="/" style="color:#45dcff">Kembali ke beranda</a></p></div><script>const q=new URLSearchParams(location.search),token=q.get('token'),userId=q.get('user');const msg=document.getElementById('msg');document.getElementById('save').onclick=async()=>{const p=document.getElementById('p').value,p2=document.getElementById('p2').value;if(p.length<6)return msg.innerHTML='<div class="msg err">Password minimal 6 karakter.</div>';if(p!==p2)return msg.innerHTML='<div class="msg err">Konfirmasi password tidak sama.</div>';try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,userId,password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal mengubah sandi.');msg.innerHTML='<div class="msg ok">Sandi berhasil diubah. Silakan login kembali.</div>';document.getElementById('save').disabled=true}catch(e){msg.innerHTML='<div class="msg err">'+e.message+'</div>'}};</script></body></html>
