<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaksi - Yamzz Market</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200">
</head>
<body>
<main class="container" style="max-width:900px;margin:0 auto;padding:28px 18px;">
  <section class="card" style="text-align:center;padding:48px 22px;">
    <span class="material-symbols-rounded" style="font-size:52px;color:#45ddff;text-shadow:0 0 18px rgba(69,221,255,.65);">receipt_long</span>
    <h1 style="margin:15px 0 8px;">Transaksi</h1>
    <p style="opacity:.75;">Riwayat transaksi akun Yamzz Market.</p>
  </section>
</main>

<nav class="bottom-nav" aria-label="Navigasi utama">
  <a href="index.html" data-nav="home">
    <span class="material-symbols-rounded">home</span>
    <span>Beranda</span>
  </a>
  <a href="ppob.html" data-nav="products">
    <span class="material-symbols-rounded">shopping_bag</span>
    <span>Produk</span>
  </a>
  <a href="deposit.html" data-nav="balance">
    <span class="material-symbols-rounded">account_balance_wallet</span>
    <span>Saldo</span>
  </a>
  <a href="transactions.html" data-nav="transactions">
    <span class="material-symbols-rounded">receipt_long</span>
    <span>Transaksi</span>
  </a>  <a href="about.html" data-nav="about">
    <span class="material-symbols-rounded">info</span>
    <span>Tentang</span>
  </a>

  <a href="profile.html" data-nav="account">
    <span class="material-symbols-rounded">person</span>
    <span>Akun</span>
  </a>
</nav>
<script>
(function(){
  const path = location.pathname.split('/').pop() || 'index.html';
  const map = {
    'index.html':'home',
    '':'home',
    'ppob.html':'products',
    'jasteb.html':'products',
    'hosting.html':'products',
    'aplikasi-jb.html':'products',
    'deposit.html':'balance',
    'transactions.html':'transactions',
    'profile.html':'account',
    'about.html':'about'
  };
  const active = map[path] || 'home';
  document.querySelectorAll('.bottom-nav a').forEach(function(a){
    if(a.dataset.nav === active) a.classList.add('active');
  });
})();
</script>

<script src="/site.js"></script>
</body>
</html>
